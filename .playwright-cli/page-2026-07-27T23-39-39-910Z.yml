            - heading "Gantt chart" [level=1] [ref=e640]
            - paragraph [ref=e641]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=e642]:
            - listitem [ref=e643]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=e646]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=e649]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=e652]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=e655]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=e658]: SSR-safe split shell with one vertical scroll owner
          - tablist [ref=e661]:
