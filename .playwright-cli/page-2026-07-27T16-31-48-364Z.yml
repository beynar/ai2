      - main [ref=e632]:
        - article [ref=e634]:
          - generic [ref=e635]:
            - heading "Event calendar" [level=1] [ref=e636]
            - paragraph [ref=e637]: A complete scheduling surface with typed recurrence, resources, immutable transactions, and accessible pointer or keyboard interaction.
          - list [ref=e638]:
            - listitem [ref=e639]: Month, week, day, N-day, agenda, resource-day, and virtualized timeline views
            - listitem [ref=e642]: Timed, all-day, multi-day, background, and recurring items
            - listitem [ref=e645]: Move, resize, range creation, keyboard, touch, and two-click selection
            - listitem [ref=e648]: Explicit IANA time zones with DST-safe civil-day math
            - listitem [ref=e651]: Typed snippets, resources, callbacks, and imperative API
            - listitem [ref=e654]: Multi-resource assignment, per-resource constraints, copy/paste, and undo/redo
            - listitem [ref=e657]: Consumer-owned loading and persistence with guarded revert
          - tablist [ref=e660]:
            - tab "Usage" [ref=e661] [cursor=pointer]
            - tab "Examples" [ref=e662] [cursor=pointer]
            - tab "Structure" [ref=e663] [cursor=pointer]
          - generic [ref=e664]:
            - generic [ref=e665]:
              - region [ref=e666]:
                - heading "Integration contract" [level=2] [ref=e667]
                - paragraph [ref=e668]:
                  - text: Timed values are absolute
                  - code [ref=e669]: Date
                  - text: instants. All-day values are canonical
                  - code [ref=e670]: YYYY-MM-DD
                  - text: civil dates with exclusive ends. The supported civil display domain runs from
                  - code [ref=e671]: 0001-01-01
                  - text: through the last renderable day
                  - code [ref=e672]: 9999-12-30
                  - text: ;
                  - code [ref=e673]: 9999-12-31
                  - text: remains available as the maximum exclusive boundary. Direct invalid profiles and jumps throw; previous/next beyond the domain are no-ops.
                - generic [ref=e674]:
                  - generic [ref=e675]:
                    - heading "State, navigation, and loading" [level=3] [ref=e676]
                    - paragraph [ref=e677]: "items, resources, date, view, dayCount, and selection are controlled values. Treat collections and definitions as immutable: every application update needs a fresh outer array and replacement objects. Header and API navigation reassign the bindable date/view values; narrow layouts never change the requested view. onRangeChange reports the exact half-open fetchRange, while the application owns requests, caching, retry UI, and loading."
                  - generic [ref=e678]:
                    - heading "Views and display settings" [level=3] [ref=e679]
                    - paragraph [ref=e680]: Month supports fixed or natural rows, outside days, hidden weekends, week numbers, overflow, and multi-day bars. Week, day, and N-day share timed packing, all-day lanes, background ranges, now indication, and scrolling. Agenda groups the same occurrences across agendaDayCount. Resource is one day with a shared vertical axis and one column per leaf. Timeline uses dayCount across a horizontal time axis and virtualizes leaf rows. Use the documented hour, interval, snap, timeline, off-day, business-hour, chrome, and scroll props; invalid values throw instead of clamping.
                  - generic [ref=e681]:
                    - heading "Mutations, validation, and dialogs" [level=3] [ref=e682]
                    - paragraph [ref=e683]: "Drag, keyboard mode, both resize edges, API updates, paste, and history share one immutable mutation boundary. Focus an empty slot and press Space, extend with arrows, then press Enter to create a keyboard range; pointer users can click its two endpoints. Structural/range checks run before resource hours, overlap, and custom policy. onItemUpdate may reject or adjust, and adjustments are revalidated. onItemsChange receives one guarded transaction. Mod+C/Mod+V copies a selected occurrence as a standalone item; Mod+Z and Mod+Shift+Z undo and redo up to historyLimit. Empty-slot creation ends at onSlotSelect: compose a Svelai Dialog and Form, then add the validated domain item yourself."
                  - generic [ref=e684]:
                    - heading "Snippets and theme" [level=3] [ref=e685]
                    - paragraph [ref=e686]: header exposes ready-made navigation, title, view, date-picker, and action snippets. item, dayHeader, monthCell, timeGutter, allDay, overflow, agenda, resourceHeader, nowIndicatorContent, dragPreview, empty, and loadingContent customize owned regions. Render defaultContent when wrapping defaults. Semantic wrappers, focus, disclosures, drag wiring, and announcements remain calendar-owned. Override theme per instance or use setEventCalendarTheme globally; CSS metric variables tune geometry.
                  - generic [ref=e687]:
                    - heading "Recurrence and time zones" [level=3] [ref=e688]
                    - paragraph [ref=e689]: timeZone is always explicit. Timed recurrence also requires its scheduling recurrenceTimeZone; floating all-day recurrence stays date-only when the display zone changes. Occurrence scope persists an exception whose originalStart keeps the source representation. Series scope transforms the source and every bound exception atomically, so it is valid only when items contains the complete exception set. Windowed loading should keep occurrence or disabled scope unless it can prove completeness.
                  - generic [ref=e690]:
                    - heading "Resources, RTL, and accessibility" [level=3] [ref=e691]
                    - paragraph [ref=e692]: "Resources are a typed flat tree: parents group and leaves accept one or many assignments; unresolved items remain visible in Unassigned. Leaves may own businessHours and readOnly policy, while custom fields reach resourceHeader. Multi-assigned events render in every resolved resource projection, and dragging replaces only the grabbed projection. dir mirrors physical horizontal movement while previous/next remain chronological. Grids, buttons, disclosures, keyboard mutation/range creation, live status, reduced motion, reflow, and horizontal overflow are built in."
