      - article [ref=e25]:
        - generic [ref=e26]:
          - heading "Event calendar" [level=1] [ref=e27]
          - paragraph [ref=e28]: A complete scheduling surface with typed recurrence, resources, immutable transactions, and accessible pointer or keyboard interaction.
        - list [ref=e29]:
          - listitem [ref=e30]: Month, week, day, N-day, agenda, and resource-day views
          - listitem [ref=e33]: Timed, all-day, multi-day, background, and recurring items
          - listitem [ref=e36]: Move, resize, range creation, keyboard, touch, and two-click selection
          - listitem [ref=e39]: Explicit IANA time zones with DST-safe civil-day math
          - listitem [ref=e42]: Typed snippets, resources, callbacks, and imperative API
          - listitem [ref=e45]: Multi-resource assignment, per-resource constraints, copy/paste, and undo/redo
          - listitem [ref=e48]: Consumer-owned loading and persistence with guarded revert
        - tablist [ref=e51]:
          - tab "Usage" [ref=e52] [cursor=pointer]
          - tab "Examples" [ref=e53] [cursor=pointer]
          - tab "Structure" [ref=e54] [cursor=pointer]
        - generic [ref=e55]:
          - generic [ref=e56]:
            - region [ref=e57]:
              - heading "Integration contract" [level=2] [ref=e58]
              - paragraph [ref=e59]:
                - text: Timed values are absolute
                - code [ref=e60]: Date
                - text: instants. All-day values are canonical
                - code [ref=e61]: YYYY-MM-DD
                - text: civil dates with exclusive ends. The supported civil display domain runs from
                - code [ref=e62]: 0001-01-01
                - text: through the last renderable day
                - code [ref=e63]: 9999-12-30
                - text: ;
                - code [ref=e64]: 9999-12-31
                - text: remains available as the maximum exclusive boundary. Direct invalid profiles and jumps throw; previous/next beyond the domain are no-ops.
              - generic [ref=e65]:
                - generic [ref=e66]:
                  - heading "State, navigation, and loading" [level=3] [ref=e67]
                  - paragraph [ref=e68]: "items, resources, date, view, dayCount, and selection are controlled values. Treat collections and definitions as immutable: every application update needs a fresh outer array and replacement objects. Header and API navigation reassign the bindable date/view values; narrow layouts never change the requested view. onRangeChange reports the exact half-open fetchRange, while the application owns requests, caching, retry UI, and loading."
                - generic [ref=e69]:
                  - heading "Views and display settings" [level=3] [ref=e70]
                  - paragraph [ref=e71]: month owns fixed or natural rows, outside days, week numbers, and overflow. timeGrid owns displayed hours, labels, click duration, snap duration, initial scroll, and clock refresh. availability owns off days, business hours, and mutation constraints. allDayConversion owns conversion duration policy. Agenda groups the same occurrences across agendaDayCount. Resource is one day with a shared vertical axis and one column per leaf. Invalid values throw instead of clamping.
                - generic [ref=e72]:
                  - heading "Mutations, validation, and dialogs" [level=3] [ref=e73]
                  - paragraph [ref=e74]: "Drag, keyboard mode, both resize edges, API updates, paste, and history share one immutable mutation boundary. Focus an empty slot and press Space, extend with arrows, then press Enter to create a keyboard range; pointer users can click its two endpoints. Structural/range checks run before resource hours, overlap, and custom policy. resolveItemUpdate may reject or adjust, and adjustments are revalidated. onItemsChange receives one guarded transaction. Mod+C/Mod+V copies a selected occurrence as a standalone item; Mod+Z and Mod+Shift+Z undo and redo up to historyLimit. Empty-slot creation ends at onSlotSelect, whose source identifies drag-create, keyboard, or single-pointer input: compose a Svelai Dialog and Form, then add the validated domain item yourself."
                - generic [ref=e75]:
                  - heading "Snippets and theme" [level=3] [ref=e76]
                  - paragraph [ref=e77]: header exposes ready-made navigation, title, view, date-picker, and action snippets; false removes it. item customizes event content in every view, including agenda, and receives defaultContent plus markerContent, titleContent, and timeContent. overflowContent can wrap defaultContent without rebuilding the draggable, accessible hidden-item list. itemTooltip customizes the item HoverCard and false removes it. nowIndicator accepts a custom renderer or false. timeGutter, empty, loadingContent, dayHeader, monthCell, allDay, overflow, agendaDetails, resourceHeader, and dragPreview retain their focused contracts. Semantic wrappers, focus, disclosures, drag wiring, and announcements remain calendar-owned. Override theme per instance or use setEventCalendarTheme globally; CSS metric variables tune geometry.
                - generic [ref=e78]:
                  - heading "Recurrence and time zones" [level=3] [ref=e79]
                  - paragraph [ref=e80]: timeZone is always explicit. Timed recurrence also requires its scheduling recurrenceTimeZone; floating all-day recurrence stays date-only when the display zone changes. Occurrence scope persists an exception whose originalStart keeps the source representation. Series scope transforms the source and every bound exception atomically, so it is valid only when items contains the complete exception set. Windowed loading should keep occurrence or disabled scope unless it can prove completeness.
                - generic [ref=e81]:
                  - heading "Resources, RTL, and accessibility" [level=3] [ref=e82]
                  - paragraph [ref=e83]: "Resources are a typed flat tree: parents group and leaves accept one or many assignments; unresolved items remain visible in Unassigned. Leaves may own businessHours and readOnly policy, while custom fields reach resourceHeader. Multi-assigned events render in every resolved resource projection, and dragging replaces only the grabbed projection. dir mirrors physical horizontal movement while previous/next remain chronological. Grids, buttons, disclosures, keyboard mutation/range creation, live status, reduced motion, reflow, and horizontal overflow are built in."
            - generic [ref=e84]:
              - generic [ref=e85]:
                - heading "One model, six views" [level=2] [ref=e86]
                - paragraph [ref=e87]: Use the built-in switcher to inspect the same timed, all-day, background, multi-day, recurring, and resource-assigned definitions in every view.
