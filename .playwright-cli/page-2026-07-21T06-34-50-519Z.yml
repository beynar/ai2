      - main [ref=f3e624]:
        - article [ref=f3e626]:
          - generic [ref=f3e627]:
            - heading "Color system" [level=1] [ref=f3e628]
            - paragraph [ref=f3e629]: Choose meaning, resting surface, and interaction independently. This separation keeps components coherent across light and dark themes.
          - generic [ref=f3e630]:
            - heading "The three decisions" [level=2] [ref=f3e631]
            - list [ref=f3e632]:
              - listitem [ref=f3e633]:
                - strong [ref=f3e634]: 1. Meaning.
                - text: Choose primary, neutral, danger, success, warning, or info.
              - listitem [ref=f3e635]:
                - strong [ref=f3e636]: 2. Resting surface.
                - text: Choose where the element sits before interaction.
              - listitem [ref=f3e637]:
                - strong [ref=f3e638]: 3. Interaction.
                - text: Add
                - code [ref=f3e639]: state-layer
                - text: for hover, virtual focus, and press.
          - generic [ref=f3e640]:
            - heading "Semantic colors" [level=2] [ref=f3e641]
            - generic [ref=f3e642]:
              - paragraph [ref=f3e643]: A family name communicates meaning. Its suffix communicates a tonal treatment—not component state and not elevation.
              - paragraph [ref=f3e644]:
                - text: Use
                - code [ref=f3e645]: "{color}-contrast"
                - text: on solid fills and
                - code [ref=f3e646]: "{color}-muted-readable"
                - text: on muted fills. Use
                - code [ref=f3e647]: "{color}-readable"
                - text: when the semantic color itself is text on a neutral surface.
            - generic [ref=f3e648]:
              - generic [ref=f3e649]:
                - generic [ref=f3e650]:
                  - paragraph [ref=f3e651]: primary
                  - paragraph [ref=f3e652]: Main brand action and strongest product emphasis.
                - generic [ref=f3e653]:
                  - code [ref=f3e656]: primary
                  - code [ref=f3e659]: dark
                  - code [ref=f3e662]: light
                  - code [ref=f3e665]: lighter
                  - code [ref=f3e668]: muted
                  - code [ref=f3e671]: contrast
              - generic [ref=f3e672]:
                - generic [ref=f3e673]:
                  - paragraph [ref=f3e674]: secondary
