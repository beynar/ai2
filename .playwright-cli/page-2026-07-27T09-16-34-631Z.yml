                  - generic [ref=f4e672]:
                    - heading "State, navigation, and loading" [level=3] [ref=f4e673]
                    - paragraph [ref=f4e674]: "items, resources, date, view, dayCount, and selection are controlled values. Treat collections and definitions as immutable: every application update needs a fresh outer array and replacement objects. Header and API navigation reassign the bindable date/view values; narrow layouts never change the requested view. onRangeChange reports the exact half-open fetchRange, while the application owns requests, caching, retry UI, and loading."
                  - generic [ref=f4e675]:
                    - heading "Views and display settings" [level=3] [ref=f4e676]
                    - paragraph [ref=f4e677]: Month supports fixed or natural rows, outside days, hidden weekends, week numbers, overflow, and multi-day bars. Week, day, and N-day share timed packing, all-day lanes, background ranges, now indication, and scrolling. Agenda groups the same occurrences across agendaDayCount. Resource is one day with a shared axis and one column per leaf. Use the documented hour, interval, snap, off-day, business-hour, chrome, and scroll props; invalid values throw instead of clamping.
                  - generic [ref=f4e678]:
                    - heading "Mutations, validation, and dialogs" [level=3] [ref=f4e679]
                    - paragraph [ref=f4e680]: "Drag, keyboard mode, both resize edges, and API updates share one proposal pipeline. Focus an empty slot and press Space, extend with arrows, then press Enter to create a keyboard range; pointer users can click its two endpoints. Structural/range checks run before business hours, overlap, and custom policy. onItemUpdate may reject or adjust, and adjustments are revalidated. onItemsChange receives one immutable transaction with guarded revert. Empty-slot creation ends at onSlotSelect: compose a Svelai Dialog and Form with DateInput, TimeInput, Select, and Switch, then add the validated domain item yourself."
                  - generic [ref=f4e681]:
                    - heading "Snippets and theme" [level=3] [ref=f4e682]
                    - paragraph [ref=f4e683]: header exposes ready-made navigation, title, view, date-picker, and action snippets. item, dayHeader, monthCell, timeGutter, allDay, overflow, agenda, resourceHeader, nowIndicatorContent, dragPreview, empty, and loadingContent customize owned regions. Render defaultContent when wrapping defaults. Semantic wrappers, focus, disclosures, drag wiring, and announcements remain calendar-owned. Override theme per instance or use setEventCalendarTheme globally; CSS metric variables tune geometry.
                  - generic [ref=f4e684]:
                    - heading "Recurrence and time zones" [level=3] [ref=f4e685]
                    - paragraph [ref=f4e686]: timeZone is always explicit. Timed recurrence also requires its scheduling recurrenceTimeZone; floating all-day recurrence stays date-only when the display zone changes. Occurrence scope persists an exception whose originalStart keeps the source representation. Series scope transforms the source and every bound exception atomically, so it is valid only when items contains the complete exception set. Windowed loading should keep occurrence or disabled scope unless it can prove completeness.
                  - generic [ref=f4e687]:
                    - heading "Resources, RTL, and accessibility" [level=3] [ref=f4e688]
                    - paragraph [ref=f4e689]: "Resources are a typed flat tree: parents group and leaves accept assignment; unresolved items remain visible in Unassigned. Custom resource fields reach resourceHeader. dir mirrors physical horizontal movement while previous/next remain chronological. Grids, groups, buttons, disclosures, roving focus, keyboard move/resize/range creation, Enter commit, Escape cancel, two-click range selection, live status, reduced motion, 24px targets, 200% reflow, and horizontal overflow are built in."
              - generic [ref=f4e690]:
