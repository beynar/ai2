      - main [ref=f5e624]:
        - article [ref=f5e626]:
          - generic [ref=f5e627]:
            - heading "Color system" [level=1] [ref=f5e628]
            - paragraph [ref=f5e629]: Choose meaning, resting surface, and interaction independently. This separation keeps components coherent across light and dark themes.
          - generic [ref=f5e630]:
            - heading "The three decisions" [level=2] [ref=f5e631]
            - list [ref=f5e632]:
              - listitem [ref=f5e633]:
                - strong [ref=f5e634]: 1. Meaning.
                - text: Choose primary, neutral, danger, success, warning, or info.
              - listitem [ref=f5e635]:
                - strong [ref=f5e636]: 2. Resting surface.
                - text: Choose where the element sits before interaction.
              - listitem [ref=f5e637]:
                - strong [ref=f5e638]: 3. Interaction.
                - text: Add
                - code [ref=f5e639]: state-layer
                - text: for hover, virtual focus, and press.
          - generic [ref=f5e640]:
            - heading "Semantic colors" [level=2] [ref=f5e641]
            - generic [ref=f5e642]:
              - paragraph [ref=f5e643]: A family name communicates meaning. Its suffix communicates a tonal treatment—not component state and not elevation.
              - paragraph [ref=f5e644]:
                - text: Use
                - code [ref=f5e645]: "{color}-contrast"
                - text: on solid fills and
                - code [ref=f5e646]: "{color}-muted-readable"
                - text: on muted fills. Use
                - code [ref=f5e647]: "{color}-readable"
                - text: when the semantic color itself is text on a neutral surface.
            - generic [ref=f5e648]:
              - generic [ref=f5e649]:
                - generic [ref=f5e650]:
                  - paragraph [ref=f5e651]: primary
                  - paragraph [ref=f5e652]: Main brand action and strongest product emphasis.
                - generic [ref=f5e653]:
                  - code [ref=f5e656]: primary
                  - code [ref=f5e659]: dark
                  - code [ref=f5e662]: light
                  - code [ref=f5e665]: lighter
                  - code [ref=f5e668]: muted
                  - code [ref=f5e671]: contrast
              - generic [ref=f5e672]:
                - generic [ref=f5e673]:
                  - paragraph [ref=f5e674]: secondary
