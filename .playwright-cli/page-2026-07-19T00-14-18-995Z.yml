                  - row [ref=e7776]:
                    - cell "about" [ref=e7777]
                    - cell [ref=e7780]:
                      - code [ref=e7781]: string | null
                    - cell [ref=e7782]
                  - row [ref=e7783]:
                    - cell "accesskey" [ref=e7784]
                    - cell [ref=e7787]:
                      - code [ref=e7788]: string | null
                    - cell [ref=e7789]
                  - row [ref=e7790]:
                    - cell "aria-activedescendant" [ref=e7791]
                    - cell [ref=e7794]:
                      - code [ref=e7795]: string | null
                    - cell "Identifies the currently active element when DOM focus is on a composite widget, textbox, group, or application." [ref=e7796]
                  - row [ref=e7797]:
                    - cell "aria-atomic" [ref=e7798]
                    - cell [ref=e7801]:
                      - code [ref=e7802]: Booleanish | null
                    - cell "Indicates whether assistive technologies will present all, or only parts of, the changed region based on the change notifications defined by the aria-relevant attribute." [ref=e7803]
                  - row [ref=e7804]:
                    - cell "aria-autocomplete" [ref=e7805]
                    - cell [ref=e7808]:
                      - code [ref=e7809]: "\"none\" | \"both\" | \"list\" | \"inline\" | null"
                    - cell "Indicates whether inputting text could trigger display of one or more predictions of the user's intended value for an input and specifies how predictions would be presented if they are made." [ref=e7810]
                  - row [ref=e7811]:
                    - cell "aria-busy" [ref=e7812]
                    - cell [ref=e7815]:
                      - code [ref=e7816]: Booleanish | null
                    - cell "Indicates an element is being modified and that assistive technologies MAY want to wait until the modifications are complete before exposing them to the user." [ref=e7817]
                  - row [ref=e7818]:
                    - cell "aria-checked" [ref=e7819]
                    - cell [ref=e7822]:
                      - code [ref=e7823]: boolean | "true" | "false" | "mixed" | null
                    - cell "Indicates the current \"checked\" state of checkboxes, radio buttons, and other widgets." [ref=e7824]
                  - row [ref=e7825]:
                    - cell "aria-colcount" [ref=e7826]
                    - cell [ref=e7829]:
                      - code [ref=e7830]: number | null
                    - cell "Defines the total number of columns in a table, grid, or treegrid." [ref=e7831]
                  - row [ref=e7832]:
                    - cell "aria-colindex" [ref=e7833]
                    - cell [ref=e7836]:
                      - code [ref=e7837]: number | null
                    - cell "Defines an element's column index or position with respect to the total number of columns within a table, grid, or treegrid." [ref=e7838]
                  - row [ref=e7839]:
                    - cell "aria-colspan" [ref=e7840]
                    - cell [ref=e7843]:
                      - code [ref=e7844]: number | null
                    - cell "Defines the number of columns spanned by a cell or gridcell within a table, grid, or treegrid." [ref=e7845]
                  - row [ref=e7846]:
                    - cell "aria-controls" [ref=e7847]
                    - cell [ref=e7850]:
                      - code [ref=e7851]: string | null
                    - cell "Identifies the element (or elements) whose contents or presence are controlled by the current element." [ref=e7852]
                  - row [ref=e7853]:
                    - cell "aria-current" [ref=e7854]
                    - cell [ref=e7857]:
                      - code [ref=e7858]: "\"step\" | \"date\" | Booleanish | \"page\" | \"location\" | \"time\" | null"
                    - cell "Indicates the element that represents the current item within a container or set of related elements." [ref=e7859]
                  - row [ref=e7860]:
                    - cell "aria-describedby" [ref=e7861]
                    - cell [ref=e7864]:
                      - code [ref=e7865]: string | null
                    - cell "Identifies the element (or elements) that describes the object." [ref=e7866]
                  - row [ref=e7867]:
                    - cell "aria-details" [ref=e7868]
                    - cell [ref=e7871]:
                      - code [ref=e7872]: string | null
                    - cell "Identifies the element that provides a detailed, extended description for the object." [ref=e7873]
                  - row [ref=e7874]:
                    - cell "aria-disabled" [ref=e7875]
                    - cell [ref=e7878]:
                      - code [ref=e7879]: Booleanish | null
                    - cell "Indicates that the element is perceivable but disabled, so it is not editable or otherwise operable." [ref=e7880]
                  - row [ref=e7881]:
                    - cell "aria-dropeffect" [ref=e7882]
                    - cell [ref=e7885]:
                      - code [ref=e7886]: "\"none\" | \"link\" | \"copy\" | \"execute\" | \"move\" | \"popup\" | null"
                    - cell "Indicates what functions can be performed when a dragged object is released on the drop target." [ref=e7887]
                  - row [ref=e7888]:
                    - cell "aria-errormessage" [ref=e7889]
                    - cell [ref=e7892]:
                      - code [ref=e7893]: string | null
                    - cell "Identifies the element that provides an error message for the object." [ref=e7894]
                  - row [ref=e7895]:
                    - cell "aria-expanded" [ref=e7896]
                    - cell [ref=e7899]:
                      - code [ref=e7900]: Booleanish | null
                    - cell "Indicates whether the element, or another grouping element it controls, is currently expanded or collapsed." [ref=e7901]
                  - row [ref=e7902]:
                    - cell "aria-flowto" [ref=e7903]
                    - cell [ref=e7906]:
                      - code [ref=e7907]: string | null
                    - cell "Identifies the next element (or elements) in an alternate reading order of content which, at the user's discretion, allows assistive technology to override the general default of reading in document source order." [ref=e7908]
                  - row [ref=e7909]:
                    - cell "aria-grabbed" [ref=e7910]
                    - cell [ref=e7913]:
                      - code [ref=e7914]: Booleanish | null
                    - cell "Indicates an element's \"grabbed\" state in a drag-and-drop operation." [ref=e7915]
                  - row [ref=e7916]:
                    - cell "aria-haspopup" [ref=e7917]
                    - cell [ref=e7920]:
                      - code [ref=e7921]: Booleanish | "dialog" | "grid" | "listbox" | "menu" | "tree" | null
                    - cell "Indicates the availability and type of interactive popup element, such as menu or dialog, that can be triggered by an element." [ref=e7922]
                  - row [ref=e7923]:
                    - cell "aria-hidden" [ref=e7924]
                    - cell [ref=e7927]:
                      - code [ref=e7928]: Booleanish | null
                    - cell "Indicates whether the element is exposed to an accessibility API." [ref=e7929]
                  - row [ref=e7930]:
                    - cell "aria-invalid" [ref=e7931]
                    - cell [ref=e7934]:
                      - code [ref=e7935]: Booleanish | "grammar" | "spelling" | null
                    - cell "Indicates the entered value does not conform to the format expected by the application." [ref=e7936]
                  - row [ref=e7937]:
                    - cell "aria-keyshortcuts" [ref=e7938]
                    - cell [ref=e7941]:
                      - code [ref=e7942]: string | null
                    - cell "Indicates keyboard shortcuts that an author has implemented to activate or give focus to an element." [ref=e7943]
                  - row [ref=e7944]:
                    - cell "aria-label" [ref=e7945]
                    - cell [ref=e7948]:
                      - code [ref=e7949]: string | null
                    - cell "Defines a string value that labels the current element." [ref=e7950]
                  - row [ref=e7951]:
                    - cell "aria-labelledby" [ref=e7952]
                    - cell [ref=e7955]:
                      - code [ref=e7956]: string | null
                    - cell "Identifies the element (or elements) that labels the current element." [ref=e7957]
                  - row [ref=e7958]:
                    - cell "aria-level" [ref=e7959]
                    - cell [ref=e7962]:
                      - code [ref=e7963]: number | null
                    - cell "Defines the hierarchical level of an element within a structure." [ref=e7964]
                  - row [ref=e7965]:
                    - cell "aria-live" [ref=e7966]
                    - cell [ref=e7969]:
                      - code [ref=e7970]: "\"off\" | \"assertive\" | \"polite\" | null"
                    - cell "Indicates that an element will be updated, and describes the types of updates the user agents, assistive technologies, and user can expect from the live region." [ref=e7971]
                  - row [ref=e7972]:
