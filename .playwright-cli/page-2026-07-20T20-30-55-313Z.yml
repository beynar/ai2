              - text: Use
              - code [ref=e642]: "{color}-contrast"
              - text: on solid fills and
              - code [ref=e643]: "{color}-muted-readable"
              - text: on muted fills. Use
              - code [ref=e644]: "{color}-readable"
              - text: when the semantic color itself is text on a neutral surface.
