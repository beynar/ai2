          - generic [ref=e623]:
            - heading "Color system" [level=1] [ref=e624]
            - paragraph [ref=e625]: Choose meaning, resting surface, elevation, and interaction independently. This separation keeps components coherent across light and dark themes.
          - generic [ref=e626]:
            - heading "The four decisions" [level=2] [ref=e627]
            - list [ref=e628]:
              - listitem [ref=e629]:
                - strong [ref=e630]: 1. Meaning
                - text: Choose primary, neutral, danger, success, warning, or info.
              - listitem [ref=e631]:
                - strong [ref=e632]: 2. Resting surface
                - text: Choose where the element sits before interaction.
              - listitem [ref=e633]:
                - strong [ref=e634]: 3. Depth
                - text: Add a raised utility only when the surface needs elevation.
              - listitem [ref=e635]:
                - strong [ref=e636]: 4. Interaction
                - text: Add state-layer for hover, virtual focus, and press.
          - separator [ref=e637]:
            - generic [ref=e638]: Semantic colors
          - generic [ref=e639]:
            - paragraph [ref=e640]: A family name communicates meaning. Its suffix communicates a tonal treatment—not component state and not elevation.
