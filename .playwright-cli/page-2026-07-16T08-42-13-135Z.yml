                      - article [ref=e796]:
                        - paragraph [ref=e797]: Design system field guide
                        - heading "System foundations" [level=2] [ref=e798]
                        - paragraph [ref=e799]: A durable interface starts with a small vocabulary of semantic decisions. Components then inherit contrast, rhythm, and interaction behavior instead of rebuilding them in isolation.
                        - heading "A semantic palette" [level=3] [ref=e800]
                        - paragraph [ref=e801]: Color names should describe intent rather than a fixed swatch. That keeps foregrounds, states, and surfaces coherent when the theme changes.
                        - heading "Readable roles" [level=4] [ref=e802]
                        - paragraph [ref=e803]: Each semantic color needs a readable companion for text and icons. Muted treatments must preserve the same contract instead of relying on opacity alone.
                        - heading "Spacing as rhythm" [level=3] [ref=e804]
                        - paragraph [ref=e805]: Consistent spacing makes dense screens easier to scan. A short scale also prevents small differences from becoming accidental hierarchy.
                        - heading "Component composition" [level=2] [ref=e806]
                        - paragraph [ref=e807]: A component should own behavior and semantics while leaving composition open. The useful API is the one that makes the common case short without trapping the uncommon case.
                        - heading "Configuration over markup" [level=3] [ref=e808]
                        - paragraph [ref=e809]: Data props express repeated structures clearly. Named snippets remain available for the parts whose content genuinely needs custom markup.
                        - heading "Named content regions" [level=4] [ref=e810]
                        - paragraph [ref=e811]: Titles, descriptions, prefixes, and actions are stable regions. Naming them keeps the DOM predictable while still allowing richer rendering.
                        - heading "Accessible defaults" [level=3] [ref=e812]
                        - paragraph [ref=e813]: Native elements carry useful behavior before JavaScript runs. Focus order, labels, and keyboard interaction should be part of the component contract.
                        - heading "Release discipline" [level=2] [ref=e814]
                        - paragraph [ref=e815]: A design system changes many products at once. Small releases, focused diagnostics, and visual review keep that leverage from turning into surprise.
                        - heading "Visual regression review" [level=3] [ref=e816]
                        - paragraph [ref=e817]: Inspect real content at several widths. Wrapped labels, focus rings, and scroll-boundary states reveal failures that isolated snapshots often miss.
