            - heading "Chart" [level=1] [ref=e648]
            - paragraph [ref=e649]: Typed top-level props for cartesian, polar, relation, and faceted charts without exposing the rendering library.
          - list [ref=e650]:
            - listitem [ref=e651]: One shared typed dataset with ordered, layered marks
            - listitem [ref=e654]: Summary and empirical distributions through one variant prop
            - listitem [ref=e657]: Point and responsive hexbin scatter variants
            - listitem [ref=e660]: Derived reference, regression, interval, and rolling analysis layers
            - listitem [ref=e663]: Explicit matrix grids and automatic contribution calendars
            - listitem [ref=e666]: Pie, donut, and waffle proportions through one variant prop
            - listitem [ref=e669]: Tree, network, and Sankey relations through one variant prop
            - listitem [ref=e672]: Direct scale, axis, mark, color, curve, and tooltip props
            - listitem [ref=e675]: Optional deterministic SSR with initial dimensions
            - listitem [ref=e678]: Responsive SVG rendering after mount
            - listitem [ref=e681]: Grouped pointer tooltip interaction
