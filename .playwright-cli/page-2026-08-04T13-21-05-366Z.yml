                - paragraph [ref=e692]:
                  - text: Import
                  - code [ref=e693]: Chart
                  - text: and its local types from
                  - code [ref=e694]: svelai/chart
                  - text: . Every mark reads from the same data array and renders in mark order. A semantic
                  - code [ref=e695]: series
                  - text: mark composes a default line with optional points and either an area or interval layer. Bars use their own mark with grouped and stacked variants. A stacked bar uses
                  - code [ref=e696]: offset="normalize"
                  - text: for percentage composition.
                - paragraph [ref=e697]:
                  - text: Pass
                  - code [ref=e698]: initialDimensions
                  - text: when the server must emit the initial SVG. Omit it for a stable empty server host that mounts the chart only in the browser.
                - paragraph [ref=e699]:
                  - text: Set
                  - code [ref=e700]: viewport
                  - text: to enable drag-to-zoom on the x axis. The chart renders a brush, animates to the selected domain, and shows an accessible reset control. Use
                  - code [ref=e701]: viewport=[object Object]
                  - text: for a rectangular x/y selection, as shown by the scatter demo, or use the object form to configure the transition.
                - paragraph [ref=e702]:
                  - text: Add an
                  - code [ref=e703]: analysis
                  - text: array to a series, scatter, bar, or distribution mark. Reference analysis derives a mean, median, quantile, or standard-deviation band. Scatter and numeric series can derive a linear regression with a confidence or prediction interval. Series can also derive a rolling mean or median. These layers use the same channels and do not add tooltip points.
                - paragraph [ref=e704]:
                  - text: Enable
                  - code [ref=e705]: tooltip
                  - text: to compare every series at the pointer category or date. The tooltip escapes clipped containers through its viewport portal without adding chart focus states.
