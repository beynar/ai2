        - generic [ref=e665]:
          - generic [ref=e666]:
            - region [ref=e667]:
              - heading "Integration contract" [level=2] [ref=e668]
              - paragraph [ref=e669]:
                - text: All scheduled values are absolute
                - code [ref=e670]: Date
                - text: instants and every range is half-open. Task, dependency, resource, assignment, and calendar identifiers must be stable and unique. Invalid hierarchies, graph cycles, missing references, contradictory schedules, and stale transactions surface as
                - code [ref=e671]: GanttChartError
                - text: ; the component never substitutes plausible data.
              - generic [ref=e672]:
                - generic [ref=e673]:
                  - heading "Controlled definitions and resolved state" [level=3] [ref=e674]
                  - paragraph [ref=e675]: tasks, dependencies, and assignments are bindable immutable collections. resources and calendars are immutable inputs. Summaries derive their span and weighted progress from descendants; WBS, working duration, slack, critical state, and violations live on resolved nodes instead of mutating consumer records.
                - generic [ref=e676]:
                  - heading "Explicit scheduling time" [level=3] [ref=e677]
                  - paragraph [ref=e678]: timeZone is required. Project, task, and resource calendars use explicit IANA zones, half-open working intervals, and civil-date exceptions. Unscheduled tasks stay visible without a bar, while milestones require equal start and end instants.
                - generic [ref=e679]:
                  - heading "Application-owned editing" [level=3] [ref=e680]
                  - paragraph [ref=e681]: GanttChart does not own create or edit dialogs. Compose task callbacks with Svelai Dialog and Form controls, validate the domain record, then publish a fresh controlled array. Persistence and retry policy remain at the application boundary.
                - generic [ref=e682]:
                  - heading "Composition and theme" [level=3] [ref=e683]
                  - paragraph [ref=e684]: Header, task, timeline, tooltip, progress, project-element, resource, loading, and empty snippets customize content inside component-owned semantics. Use the ganttChart theme key and CSS metric variables for geometry without replacing selection, focus, hit targets, or announcements.
            - generic [ref=e685]:
              - generic [ref=e686]:
                - heading "Controlled project shell" [level=2] [ref=e687]
                - paragraph [ref=e688]: The tree and time panes share one resolved hierarchy, expansion model, row height, selection, and vertical scroll owner. Resize the inline splitter or change the zoom level without mutating task definitions.
