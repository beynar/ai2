                    - cell "Identifies the currently active element when DOM focus is on a composite widget, textbox, group, or application." [ref=f1e3899]
                  - row [ref=f1e3900]:
                    - cell "aria-atomic" [ref=f1e3901]
                    - cell [ref=f1e3904]:
                      - code [ref=f1e3905]: Booleanish | null
                    - cell "Indicates whether assistive technologies will present all, or only parts of, the changed region based on the change notifications defined by the aria-relevant attribute." [ref=f1e3906]
                  - row [ref=f1e3907]:
                    - cell "aria-autocomplete" [ref=f1e3908]
                    - cell [ref=f1e3911]:
                      - code [ref=f1e3912]: "\"none\" | \"both\" | \"list\" | \"inline\" | null"
                    - cell "Indicates whether inputting text could trigger display of one or more predictions of the user's intended value for an input and specifies how predictions would be presented if they are made." [ref=f1e3913]
                  - row [ref=f1e3914]:
                    - cell "aria-busy" [ref=f1e3915]
                    - cell [ref=f1e3918]:
                      - code [ref=f1e3919]: Booleanish | null
                    - cell "Indicates an element is being modified and that assistive technologies MAY want to wait until the modifications are complete before exposing them to the user." [ref=f1e3920]
                  - row [ref=f1e3921]:
                    - cell "aria-checked" [ref=f1e3922]
                    - cell [ref=f1e3925]:
                      - code [ref=f1e3926]: boolean | "true" | "false" | "mixed" | null
                    - cell "Indicates the current \"checked\" state of checkboxes, radio buttons, and other widgets." [ref=f1e3927]
                  - row [ref=f1e3928]:
                    - cell "aria-colcount" [ref=f1e3929]
                    - cell [ref=f1e3932]:
