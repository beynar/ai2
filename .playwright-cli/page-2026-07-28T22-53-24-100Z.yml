                  - generic [ref=f17e673]:
                    - heading "Controlled definitions and resolved state" [level=3] [ref=f17e674]
                    - paragraph [ref=f17e675]: tasks, dependencies, and assignments are bindable immutable collections. resources and calendars are immutable inputs. Summaries derive their span and weighted progress from descendants; WBS, working duration, slack, critical state, and violations live on resolved nodes instead of mutating consumer records.
                  - generic [ref=f17e676]:
                    - heading "Explicit scheduling time" [level=3] [ref=f17e677]
                    - paragraph [ref=f17e678]: timeZone is required. Project, task, and resource calendars use explicit IANA zones, half-open working intervals, and civil-date exceptions. Unscheduled tasks stay visible without a bar, while milestones require equal start and end instants.
                  - generic [ref=f17e679]:
                    - heading "One mutation boundary" [level=3] [ref=f17e680]
                    - paragraph [ref=f17e681]: Pointer and touch gestures, keyboard modes, built-in or custom column editors, clipboard, history, and API calls produce the same typed proposals. Move, resize, and range snapping follows the active zoom scale unless snapDuration fixes a consumer-defined step. Structural checks run before canUpdate hooks; adjusted records are revalidated before fresh arrays and changed objects publish. Change callbacks carry one guarded revert and never swallow persistence failures.
                  - generic [ref=f17e682]:
                    - heading "Scheduling and completed tasks" [level=3] [ref=f17e683]
                    - paragraph [ref=f17e684]: All four dependency types support signed lag. Auto-scheduling preserves working duration and never moves a completed leaf task; an impossible successor or constraint is exposed as a violation. Critical-path and slack analysis still includes completed tasks, whose actual dates constrain successors.
                  - generic [ref=f17e685]:
                    - heading "Resources are diagnostic" [level=3] [ref=f17e686]
                    - paragraph [ref=f17e687]: Assignments, task and resource calendars, units, and capacity feed the workload panel and over-allocation markers. Resource hierarchy, filtering, and grouping never rewrite task hierarchy. This version deliberately performs no automatic resource leveling.
                  - generic [ref=f17e688]:
                    - heading "Application-owned dialogs" [level=3] [ref=f17e689]
                    - paragraph [ref=f17e690]: GanttChart does not own create or edit dialogs. Compose onTaskDoubleClick or onEmptyRangeSelect with Svelai Dialog and Form controls, validate the domain record, then publish a fresh controlled array or call the imperative API. Persistence, fetching, retries, and conflict UI remain at the application boundary.
                  - generic [ref=f17e691]:
                    - heading "Composition, accessibility, and scale" [level=3] [ref=f17e692]
                    - paragraph [ref=f17e693]: Every content snippet renders inside component-owned roles, focus targets, selection, hit areas, gestures, and live announcements. M/S/E/P/D/R enter keyboard mutation modes; Enter commits and Escape cancels. One virtual row model and a windowed time axis keep mounted DOM bounded. Use the ganttChart theme key and CSS metric variables without replacing those owners.
              - generic [ref=f17e694]:
                - generic [ref=f17e695]:
                  - heading "Controlled project shell" [level=2] [ref=f17e696]
                  - paragraph [ref=f17e697]: The tree and time panes share one resolved hierarchy, expansion model, row height, selection, and vertical scroll owner. Resize the inline splitter or change the zoom level without mutating task definitions.
