                    - paragraph [ref=f20e675]: tasks, dependencies, and assignments are bindable immutable collections. resources and calendars are immutable inputs. Summaries derive their span and weighted progress from descendants; WBS, working duration, slack, critical state, and violations live on resolved nodes instead of mutating consumer records.
                  - generic [ref=f20e676]:
                    - heading "Explicit scheduling time" [level=3] [ref=f20e677]
                    - paragraph [ref=f20e678]: timeZone is required. Project, task, and resource calendars use explicit IANA zones, half-open working intervals, and civil-date exceptions. Unscheduled tasks stay visible without a bar, while milestones require equal start and end instants.
                  - generic [ref=f20e679]:
                    - heading "Application-owned editing" [level=3] [ref=f20e680]
                    - paragraph [ref=f20e681]: GanttChart does not own create or edit dialogs. Compose task callbacks with Svelai Dialog and Form controls, validate the domain record, then publish a fresh controlled array. Persistence and retry policy remain at the application boundary.
                  - generic [ref=f20e682]:
                    - heading "Composition and theme" [level=3] [ref=f20e683]
                    - paragraph [ref=f20e684]: Header, task, timeline, tooltip, progress, project-element, resource, loading, and empty snippets customize content inside component-owned semantics. Use the ganttChart theme key and CSS metric variables for geometry without replacing selection, focus, hit targets, or announcements.
