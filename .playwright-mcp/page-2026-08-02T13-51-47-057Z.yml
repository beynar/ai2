      - main [ref=e644]:
        - article [ref=e646]:
          - generic [ref=e647]:
            - heading "Gantt chart" [level=1] [ref=e648]
            - paragraph [ref=e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=e650]:
            - listitem [ref=e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=e666]: SSR-safe split shell with bounded row and time-axis windowing
          - tablist [ref=e669]:
            - tab "Usage" [ref=e670] [cursor=pointer]
            - tab "Examples" [ref=e671] [cursor=pointer]
            - tab "Structure" [ref=e672] [cursor=pointer]
          - generic [ref=e673]:
            - generic [ref=e674]:
              - region [ref=e675]:
                - heading "Integration contract" [level=2] [ref=e676]
                - paragraph [ref=e677]:
                  - text: All scheduled values are absolute
                  - code [ref=e678]: Date
                  - text: instants and every range is half-open. Task, dependency, resource, assignment, and calendar identifiers must be stable and unique. Invalid hierarchies, graph cycles, missing references, contradictory schedules, and stale transactions surface as
                  - code [ref=e679]: GanttChartError
                  - text: ; the component never substitutes plausible data.
                - generic [ref=e680]:
                  - generic [ref=e681]:
                    - heading "Controlled definitions and resolved state" [level=3] [ref=e682]
                    - paragraph [ref=e683]: tasks, dependencies, and assignments are bindable immutable collections. resources and calendars are immutable inputs. Summaries derive their span and weighted progress from descendants; WBS, working duration, slack, critical state, and violations live on resolved nodes instead of mutating consumer records.
                  - generic [ref=e684]:
                    - heading "Explicit scheduling time" [level=3] [ref=e685]
                    - paragraph [ref=e686]: timeZone is required. Project, task, and resource calendars use explicit IANA zones, half-open working intervals, and civil-date exceptions. Unscheduled tasks stay visible without a bar, while milestones require equal start and end instants.
                  - generic [ref=e687]:
                    - heading "One mutation boundary" [level=3] [ref=e688]
                    - paragraph [ref=e689]: Pointer and touch gestures, keyboard modes, built-in or custom column editors, clipboard, history, and API calls produce the same typed proposals. Move, resize, and range snapping follows the active zoom scale unless timeline.snapDuration fixes a consumer-defined step. Structural checks run before mutations validators; resolved records are revalidated before fresh arrays and changed objects publish. Mutation change callbacks carry one guarded revert and never swallow persistence failures.
                  - generic [ref=e690]:
                    - heading "Scheduling and completed tasks" [level=3] [ref=e691]
                    - paragraph [ref=e692]: All four dependency types support signed lag. Auto-scheduling preserves working duration and never moves a completed leaf task; an impossible successor or constraint is exposed as a violation. Critical-path and slack analysis still includes completed tasks, whose actual dates constrain successors.
                  - generic [ref=e693]:
                    - heading "Resources are diagnostic" [level=3] [ref=e694]
                    - paragraph [ref=e695]: Assignments, task and resource calendars, units, and capacity feed the workload panel and over-allocation markers. Resource hierarchy, filtering, and grouping never rewrite task hierarchy. This version deliberately performs no automatic resource leveling.
                  - generic [ref=e696]:
                    - heading "Application-owned dialogs" [level=3] [ref=e697]
                    - paragraph [ref=e698]: GanttChart does not own create or edit dialogs. Compose events.taskDoubleClick or events.emptyRangeSelect with Svelai Dialog and Form controls, validate the domain record, then publish a fresh controlled array or call the imperative API. Persistence, fetching, retries, and conflict UI remain at the application boundary.
