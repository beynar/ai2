                  - text: instants and every range is half-open. Task, dependency, resource, assignment, and calendar identifiers must be stable and unique. Invalid hierarchies, graph cycles, missing references, contradictory schedules, and stale transactions surface as
                  - code [ref=f29e679]: GanttChartError
                  - text: ; the component never substitutes plausible data.
                - generic [ref=f29e680]:
                  - generic [ref=f29e681]:
                    - heading "Controlled definitions and resolved state" [level=3] [ref=f29e682]
                    - paragraph [ref=f29e683]: tasks, dependencies, and assignments are bindable immutable collections. resources and calendars are immutable inputs. Summaries derive their span and weighted progress from descendants; WBS, working duration, slack, critical state, and violations live on resolved nodes instead of mutating consumer records.
                  - generic [ref=f29e684]:
                    - heading "Explicit scheduling time" [level=3] [ref=f29e685]
                    - paragraph [ref=f29e686]: timeZone is required. Project, task, and resource calendars use explicit IANA zones, half-open working intervals, and civil-date exceptions. Unscheduled tasks stay visible without a bar, while milestones require equal start and end instants.
                  - generic [ref=f29e687]:
                    - heading "One mutation boundary" [level=3] [ref=f29e688]
                    - paragraph [ref=f29e689]: Pointer and touch gestures, keyboard modes, built-in or custom column editors, clipboard, history, and API calls produce the same typed proposals. Move, resize, and range snapping follows the active zoom scale unless timeline.snapDuration fixes a consumer-defined step. Structural checks run before mutations validators; resolved records are revalidated before fresh arrays and changed objects publish. Mutation change callbacks carry one guarded revert and never swallow persistence failures.
                  - generic [ref=f29e690]:
                    - heading "Scheduling and completed tasks" [level=3] [ref=f29e691]
                    - paragraph [ref=f29e692]: All four dependency types support signed lag. Auto-scheduling preserves working duration and never moves a completed leaf task; an impossible successor or constraint is exposed as a violation. Critical-path and slack analysis still includes completed tasks, whose actual dates constrain successors.
                  - generic [ref=f29e693]:
                    - heading "Resources are diagnostic" [level=3] [ref=f29e694]
                    - paragraph [ref=f29e695]: Assignments, task and resource calendars, units, and capacity feed the workload panel and over-allocation markers. Resource hierarchy, filtering, and grouping never rewrite task hierarchy. This version deliberately performs no automatic resource leveling.
                  - generic [ref=f29e696]:
                    - heading "Application-owned dialogs" [level=3] [ref=f29e697]
                    - paragraph [ref=f29e698]: GanttChart does not own create or edit dialogs. Compose events.taskDoubleClick or events.emptyRangeSelect with Svelai Dialog and Form controls, validate the domain record, then publish a fresh controlled array or call the imperative API. Persistence, fetching, retries, and conflict UI remain at the application boundary.
                  - generic [ref=f29e699]:
                    - heading "Composition, accessibility, and scale" [level=3] [ref=f29e700]
                    - paragraph [ref=f29e701]: Every content snippet renders inside component-owned roles, focus targets, selection, hit areas, gestures, and live announcements. M/S/E/P/D/R enter keyboard mutation modes; Enter commits and Escape cancels. One virtual row model and a windowed time axis keep mounted DOM bounded. Size controls typography, controls, and task geometry; density controls spacing and row geometry. Use the ganttChart theme key and CSS metric variables without replacing those owners.
