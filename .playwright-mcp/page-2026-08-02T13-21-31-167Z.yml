          - generic [ref=f29e647]:
            - heading "Gantt chart" [level=1] [ref=f29e648]
            - paragraph [ref=f29e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f29e650]:
            - listitem [ref=f29e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f29e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f29e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f29e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f29e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f29e666]: SSR-safe split shell with bounded row and time-axis windowing
          - tablist [ref=f29e669]:
