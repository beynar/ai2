          - generic [ref=f29e673]:
            - generic [ref=f29e674]:
              - region [ref=f29e675]:
                - heading "Integration contract" [level=2] [ref=f29e676]
                - paragraph [ref=f29e677]:
                  - text: All scheduled values are absolute
