            - paragraph [ref=f3e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f3e650]:
            - listitem [ref=f3e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f3e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f3e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f3e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f3e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f3e666]: SSR-safe split shell with bounded row and time-axis windowing
