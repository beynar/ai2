          - generic [ref=f30e673]:
            - generic [ref=f30e674]:
              - region [ref=f30e675]:
                - heading "Integration contract" [level=2] [ref=f30e676]
                - paragraph [ref=f30e677]:
                  - text: All scheduled values are absolute
