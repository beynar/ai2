            - heading "Gantt chart" [level=1] [ref=f30e648]
            - paragraph [ref=f30e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f30e650]:
            - listitem [ref=f30e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f30e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f30e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f30e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f30e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f30e666]: SSR-safe split shell with bounded row and time-axis windowing
          - tablist [ref=f30e669]:
