            - paragraph [ref=f22e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f22e650]:
            - listitem [ref=f22e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f22e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f22e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f22e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f22e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f22e666]: SSR-safe split shell with bounded row and time-axis windowing
