            - heading "Gantt chart" [level=1] [ref=f33e648]
            - paragraph [ref=f33e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f33e650]:
            - listitem [ref=f33e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f33e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f33e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f33e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f33e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f33e666]: SSR-safe split shell with bounded row and time-axis windowing
          - tablist [ref=f33e669]:
