          - generic [ref=f33e673]:
            - generic [ref=f33e674]:
              - region [ref=f33e675]:
                - heading "Integration contract" [level=2] [ref=f33e676]
                - paragraph [ref=f33e677]:
                  - text: All scheduled values are absolute
