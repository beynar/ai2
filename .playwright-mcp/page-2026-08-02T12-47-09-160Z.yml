            - paragraph [ref=f10e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f10e650]:
            - listitem [ref=f10e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f10e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f10e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f10e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f10e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f10e666]: SSR-safe split shell with bounded row and time-axis windowing
