                    - paragraph [ref=f1e675]: tasks, dependencies, and assignments are bindable immutable collections. resources and calendars are immutable inputs. Summaries derive their span and weighted progress from descendants; WBS, working duration, slack, critical state, and violations live on resolved nodes instead of mutating consumer records.
                  - generic [ref=f1e676]:
                    - heading "Explicit scheduling time" [level=3] [ref=f1e677]
                    - paragraph [ref=f1e678]: timeZone is required. Project, task, and resource calendars use explicit IANA zones, half-open working intervals, and civil-date exceptions. Unscheduled tasks stay visible without a bar, while milestones require equal start and end instants.
                  - generic [ref=f1e679]:
                    - heading "Application-owned editing" [level=3] [ref=f1e680]
                    - paragraph [ref=f1e681]: GanttChart does not own create or edit dialogs. Compose task callbacks with Svelai Dialog and Form controls, validate the domain record, then publish a fresh controlled array. Persistence and retry policy remain at the application boundary.
                  - generic [ref=f1e682]:
                    - heading "Composition and theme" [level=3] [ref=f1e683]
                    - paragraph [ref=f1e684]: Header, task, timeline, tooltip, progress, project-element, resource, loading, and empty snippets customize content inside component-owned semantics. Use the ganttChart theme key and CSS metric variables for geometry without replacing selection, focus, hit targets, or announcements.
              - generic [ref=f1e685]:
                - generic [ref=f1e686]:
                  - heading "Controlled project shell" [level=2] [ref=f1e687]
                  - paragraph [ref=f1e688]: The tree and time panes share one resolved hierarchy, expansion model, row height, selection, and vertical scroll owner. Resize the inline splitter or change the zoom level without mutating task definitions.
