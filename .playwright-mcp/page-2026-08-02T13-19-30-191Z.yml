            - heading "Gantt chart" [level=1] [ref=f27e648]
            - paragraph [ref=f27e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f27e650]:
            - listitem [ref=f27e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f27e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f27e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f27e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f27e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f27e666]: SSR-safe split shell with bounded row and time-axis windowing
          - tablist [ref=f27e669]:
