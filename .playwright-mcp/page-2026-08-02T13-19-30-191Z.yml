          - generic [ref=f27e673]:
            - generic [ref=f27e674]:
              - region [ref=f27e675]:
                - heading "Integration contract" [level=2] [ref=f27e676]
                - paragraph [ref=f27e677]:
                  - text: All scheduled values are absolute
