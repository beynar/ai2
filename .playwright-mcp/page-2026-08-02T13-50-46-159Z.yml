            - heading "Gantt chart" [level=1] [ref=f55e648]
            - paragraph [ref=f55e649]: A typed project-scheduling surface with a hierarchical task grid, explicit working calendars, dependency analysis, and immutable controlled state.
          - list [ref=f55e650]:
            - listitem [ref=f55e651]: Hierarchical task definitions with derived summaries and WBS
            - listitem [ref=f55e654]: Explicit IANA zones, working calendars, constraints, and dependency DAG validation
            - listitem [ref=f55e657]: Critical-path, total/free slack, and resource workload analysis
            - listitem [ref=f55e660]: Bindable tasks, dependencies, assignments, expansion, selection, and zoom
            - listitem [ref=f55e663]: Svelai theme and snippet composition inside owned semantics
            - listitem [ref=f55e666]: SSR-safe split shell with bounded row and time-axis windowing
          - tablist [ref=f55e669]:
