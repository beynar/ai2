          - generic [ref=f55e673]:
            - generic [ref=f55e674]:
              - region [ref=f55e675]:
                - heading "Integration contract" [level=2] [ref=f55e676]
                - paragraph [ref=f55e677]:
                  - text: All scheduled values are absolute
